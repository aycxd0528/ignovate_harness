<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ignovate · 机器人头像</title>
<link rel="stylesheet" href="../../nailong/gui/static/react-bits-islands.css">
<style>
 :root{color-scheme:light;--brand-blue:#315cff;--paper:#fff;--ink:#171717;--muted:#777;--line:#e8e8e8;--soft:#f6f6f6;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
 :root[data-theme=dark]{color-scheme:dark;--paper:#171717;--ink:#f2f2f2;--muted:#a1a1a1;--line:#343434;--soft:#232323}
 *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);min-height:100vh}button{font:inherit;cursor:pointer;color:inherit}
 header,footer{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:26px 32px}header strong{font-size:21px;letter-spacing:-.8px}header strong span{color:var(--brand-blue)}
 #theme{border:1px solid var(--line);border-radius:20px;background:transparent;padding:5px 14px;font-size:12px}
 main{max-width:800px;margin:18px auto 64px;text-align:center;padding:0 24px}.stage{display:grid;place-items:center;height:310px}#hero{width:300px;height:300px}
 h1{font-size:36px;line-height:1.25;font-weight:550;letter-spacing:-1.5px;margin:6px 0 12px}p{color:var(--muted);margin:0}
 .states{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:30px 0 44px}.states button{border:1px solid transparent;background:transparent;border-radius:24px;padding:7px 18px;color:var(--muted)}.states button[aria-pressed=true]{background:var(--soft);border-color:var(--line);color:var(--ink)}.states button:hover{color:var(--brand-blue)}button:focus-visible{outline:2px solid var(--brand-blue);outline-offset:3px}
 .samples{border-top:1px solid var(--line);padding-top:24px;display:flex;justify-content:center;gap:48px}.sample{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.sample .ignovate-avatar{width:46px;height:46px}.sample:last-child .ignovate-avatar{width:64px;height:64px}.sample>div{display:flex;align-items:center}
 footer{border-top:1px solid var(--line);font-size:11px;color:var(--muted)}footer a{color:inherit;text-decoration:none}
 @media(max-width:560px){header,footer{padding:20px 22px}main{margin-top:0}.stage{height:270px}#hero{width:260px;height:260px}h1{font-size:30px}.states{margin-bottom:30px}.states button{padding:6px 13px}.samples{gap:16px;flex-wrap:wrap}.sample{gap:2px}}
</style>
<header><strong><span>Ignovate</span> Harness</strong><button id="theme" type="button" aria-pressed="false">深色预览</button></header>
<main>
 <div class="stage"><div id="hero"></div></div>
 <h1>从一个想法开始。</h1>
 <p id="caption" aria-live="polite">准备好了，随时开始。</p>
 <div class="states" role="group" aria-label="机器人状态">
  <button type="button" data-state="idle" aria-pressed="true">待机</button>
  <button type="button" data-state="thinking" aria-pressed="false">思考</button>
  <button type="button" data-state="tools" aria-pressed="false">执行工具</button>
  <button type="button" data-state="approval" aria-pressed="false">等待批准</button>
  <button type="button" data-state="done" aria-pressed="false">完成</button>
  <button type="button" data-state="failed" aria-pressed="false">异常</button>
 </div>
 <div class="samples"><div class="sample"><div id="small"></div><span>回复状态</span></div><div class="sample"><div id="medium"></div><span>会话标识</span></div></div>
</main>
<footer><span>Ignovate · 动态机器人头像</span><a href="https://github.com/jeremy-prt/bloub">基于 bloub · MIT</a></footer>
<script type="module">
 import {mountAvatar} from '../../nailong/gui/static/react-bits-islands.js';
 const poses={idle:{status:'idle',caption:'准备好了，随时开始。'},thinking:{status:'running',activity:'thinking',caption:'正在思考，让想法逐渐清晰。'},tools:{status:'running',activity:'tools',caption:'正在执行工具，把想法变为现实。'},approval:{status:'waiting_approval',caption:'下一步，等待你的批准。'},done:{status:'completed',caption:'本轮已完成，可以继续探索。'},failed:{status:'failed',caption:'遇到了一点问题，需要查看详情。'}};
 const controllers=[mountAvatar(document.querySelector('#hero'),{size:300,follow:true}),mountAvatar(document.querySelector('#small'),{size:46}),mountAvatar(document.querySelector('#medium'),{size:64})];
 window.avatarPreview={controllers,poses};
 for(const button of document.querySelectorAll('[data-state]'))button.addEventListener('click',()=>{
  const {caption,...pose}=poses[button.dataset.state];controllers.forEach(c=>c.update({activity:undefined,...pose}));
  document.querySelector('#caption').textContent=caption;
  for(const other of document.querySelectorAll('[data-state]'))other.setAttribute('aria-pressed',String(other===button));
 });
 document.querySelector('#theme').addEventListener('click',event=>{
  const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';
  event.target.textContent=dark?'浅色预览':'深色预览';event.target.setAttribute('aria-pressed',String(dark));
 });
</script>
</html>
