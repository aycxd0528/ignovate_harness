name: GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check release version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          python -m pip install -r requirements-release.lock --require-hashes
          python -m pip install -e . --no-deps
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build release assets
        if: matrix.python-version == '3.11'
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/build_release.py --wheel dist/*.whl
          python scripts/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.python-version == '3.11'
        with:
          name: release-assets
          path: dist/release/*
  install-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Fresh user installation
        env:
          IGNOVATE_INSTALL_HOME: ${{ runner.temp }}/ignovate-install
          IGNOVATE_BIN_DIR: ${{ runner.temp }}/ignovate-bin
          IGNOVATE_CONFIG_DIR: ${{ runner.temp }}/ignovate-config
          IGNOVATE_NO_MODIFY_PATH: '1'
        run: |
          tar -xzf release-assets/*-unix.tar.gz -C "$RUNNER_TEMP"
          sh "$RUNNER_TEMP"/ignovate-*/install.sh
          "$IGNOVATE_BIN_DIR/ignovate" set up --environment-only
          "$IGNOVATE_BIN_DIR/ignovate" set up --environment-only
          "$IGNOVATE_BIN_DIR/ignovate" --help
          "$IGNOVATE_BIN_DIR/ignovate" doctor --output-format json > "$RUNNER_TEMP/doctor.json" || test "$?" = 1
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert all(c["status"]=="ok" for c in r["checks"] if c["name"] in ("python","textual","mcp","rg"))' "$RUNNER_TEMP/doctor.json"
  windows-smoke:
    uses: ./.github/workflows/windows-native.yml
  publish:
    if: github.ref_type == 'tag'
    needs: [install-smoke, windows-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Publish validated assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "ignovate $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
