name: GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing source tag or commit to build (empty uses this branch)
        required: false
        type: string
      verified_run_id:
        description: Successful build run to publish (empty builds and verifies only)
        required: false
        type: string
      release_notes:
        description: Notes for publishing an already verified build
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.verified_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check release version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          python -m pip install -r requirements-release.lock --require-hashes
          python -m pip install -e . --no-deps
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build release assets
        if: matrix.python-version == '3.11'
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/build_release.py --wheel dist/*.whl
          python scripts/smoke_wheel.py dist/*.whl
          rm dist/release/*-windows.zip
          cd dist/release
          sha256sum *.whl *-unix.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.python-version == '3.11'
        with:
          name: release-assets
          path: dist/release/*
  install-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Fresh user installation
        env:
          IGNOVATE_INSTALL_HOME: ${{ runner.temp }}/ignovate-install
          IGNOVATE_BIN_DIR: ${{ runner.temp }}/ignovate-bin
          IGNOVATE_CONFIG_DIR: ${{ runner.temp }}/ignovate-config
          IGNOVATE_NO_MODIFY_PATH: '1'
        run: |
          tar -xzf release-assets/*-unix.tar.gz -C "$RUNNER_TEMP"
          sh "$RUNNER_TEMP"/ignovate-*/install.sh
          "$IGNOVATE_BIN_DIR/ignovate" set up --environment-only
          "$IGNOVATE_BIN_DIR/ignovate" set up --environment-only
          "$IGNOVATE_BIN_DIR/ignovate" --help
          "$IGNOVATE_BIN_DIR/ignovate" doctor --output-format json > "$RUNNER_TEMP/doctor.json" || test "$?" = 1
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert all(c["status"]=="ok" for c in r["checks"] if c["name"] in ("python","textual","mcp","rg"))' "$RUNNER_TEMP/doctor.json"
  macos-desktop:
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Install packaging and smoke dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --prefix desktop
          npm install --prefix "$RUNNER_TEMP/mac-smoke" playwright@1.62.1
      - name: Download pinned official runtime and tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/mac-python" "$RUNNER_TEMP/mac-rg" "$RUNNER_TEMP/mac-electron"
          gh release download 20260510 --repo astral-sh/python-build-standalone --pattern 'cpython-3.11.15+20260510-aarch64-apple-darwin-install_only.tar.gz' --dir "$RUNNER_TEMP/mac-python"
          echo '03bcedae9b19a48888d7dc8ba064f73f6efaaf2b13f6a8e1a1bcc062df13e855  cpython-3.11.15+20260510-aarch64-apple-darwin-install_only.tar.gz' > "$RUNNER_TEMP/mac-python/SHA256SUMS"
          (cd "$RUNNER_TEMP/mac-python" && shasum -a 256 -c SHA256SUMS)
          tar -xzf "$RUNNER_TEMP/mac-python/"*.tar.gz -C "$RUNNER_TEMP/mac-python"
          gh release download 15.2.0 --repo BurntSushi/ripgrep --pattern ripgrep-15.2.0-aarch64-apple-darwin.tar.gz --pattern ripgrep-15.2.0-aarch64-apple-darwin.tar.gz.sha256 --dir "$RUNNER_TEMP/mac-rg"
          python - "$RUNNER_TEMP/mac-rg" <<'PY'
          import hashlib, pathlib, sys
          folder=pathlib.Path(sys.argv[1]); archive=folder/'ripgrep-15.2.0-aarch64-apple-darwin.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==(folder/(archive.name+'.sha256')).read_text().split()[0]
          PY
          tar -xzf "$RUNNER_TEMP/mac-rg/"*.tar.gz -C "$RUNNER_TEMP/mac-rg"
          gh release download v44.7.0 --repo electron/electron --pattern electron-v44.7.0-darwin-arm64.zip --dir "$RUNNER_TEMP/mac-electron"
          echo 'e04e411b58a0a14375dd21b0ab4a378fd38930a702e4e20e322fee4849404c0b  electron-v44.7.0-darwin-arm64.zip' > "$RUNNER_TEMP/mac-electron/SHA256SUMS"
          (cd "$RUNNER_TEMP/mac-electron" && shasum -a 256 -c SHA256SUMS)
      - name: Build and validate installed macOS application
        run: |
          python scripts/build_macos.py --wheel release-assets/*.whl --output dist/macos --runtime-base "$RUNNER_TEMP/mac-python/python" --python-standalone-build 20260510 --ripgrep "$RUNNER_TEMP/mac-rg/ripgrep-15.2.0-aarch64-apple-darwin/rg" --electron-zip-dir "$RUNNER_TEMP/mac-electron"
          node --test tests/desktop-runtime.test.cjs
          IGNOVATE_APP="$PWD/dist/macos/Ignovate-darwin-arm64/Ignovate.app" NODE_PATH="$RUNNER_TEMP/mac-smoke/node_modules" node tests/gui-packaged.spec.cjs
          IGNOVATE_APP="$PWD/dist/macos/Ignovate-darwin-arm64/Ignovate.app" NODE_PATH="$RUNNER_TEMP/mac-smoke/node_modules" node tests/gui-first-run-packaged.spec.cjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-desktop-release
          path: |
            dist/macos/*.dmg
            dist/macos/SHA256SUMS-macos
  publish:
    if: ${{ always() && ((github.ref_type == 'tag' && needs.install-smoke.result == 'success' && needs.macos-desktop.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.verified_run_id != '' && inputs.source_ref != '')) }}
    needs: [install-smoke, macos-desktop]
    runs-on: macos-15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id || github.run_id }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: macos-desktop-release
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.verified_run_id || github.run_id }}
      - name: Verify successful source build and exact asset scope
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          api = lambda suffix: json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{suffix}'], text=True))
          run_id = os.environ.get('VERIFIED_RUN_ID')
          if run_id:
              assert run_id.isdigit()
              build = api('actions/runs/' + run_id)
              assert build['conclusion'] == 'success' and build['path'] == '.github/workflows/release.yml'
              jobs = api(f'actions/runs/{run_id}/jobs')['jobs']
              required = {'build (3.11)', 'build (3.13)', 'install-smoke (ubuntu-24.04)', 'install-smoke (macos-latest)', 'macos-desktop'}
              assert required <= {job['name'] for job in jobs if job['conclusion'] == 'success'}
          tag = os.environ['SOURCE_REF'].removeprefix('refs/tags/')
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag)
          version = tag[1:]
          expected = {f'Ignovate-{version}-macos-arm64.dmg', f'ignovate-{version}-unix.tar.gz', f'ignovate_harness-{version}-py3-none-any.whl', 'SHA256SUMS', 'SHA256SUMS-macos'}
          folder = pathlib.Path('release-assets')
          assert {p.name for p in folder.iterdir()} == expected
          for name in ('SHA256SUMS', 'SHA256SUMS-macos'):
              assert 'windows' not in (folder/name).read_text().lower()
              subprocess.run(['shasum', '-a', '256', '-c', name], cwd=folder, check=True)
          commit = api('commits/' + tag)['sha']
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'RELEASE_TAG={tag}\nRELEASE_VERSION={version}\nEXPECTED_SOURCE={commit}\n')
          PY
      - name: Verify the actual DMG signature and source identity
        run: |
          hdiutil verify "release-assets/Ignovate-$RELEASE_VERSION-macos-arm64.dmg"
          mkdir -p "$RUNNER_TEMP/release-dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/release-dmg" "release-assets/Ignovate-$RELEASE_VERSION-macos-arm64.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/release-dmg"' EXIT
          codesign --verify --deep --strict "$RUNNER_TEMP/release-dmg/Ignovate.app"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'release-dmg/Ignovate.app/Contents/Resources/release-manifest.json'
          manifest = json.loads(path.read_text())
          assert manifest['source_commit'] == os.environ['EXPECTED_SOURCE']
          assert manifest['version'] == os.environ['RELEASE_VERSION']
          print('Verified DMG source:', manifest['source_commit'])
          PY
      - name: Publish validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'release-notes.md'
          path.write_text(os.environ.get('RELEASE_NOTES') or pathlib.Path('docs/RELEASE_NOTES.md').read_text())
          PY
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --latest=false --title "ignovate $RELEASE_TAG · Preview" --notes-file "$RUNNER_TEMP/release-notes.md"
