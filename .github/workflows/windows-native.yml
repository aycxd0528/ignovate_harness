name: Windows native
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Build release bundle
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python scripts/build_release.py --wheel (Get-Item dist/*.whl).FullName
      - name: Native launcher and repair smoke
        shell: powershell
        run: ./scripts/smoke_windows_installer.ps1 -Archive (Get-Item dist/release/*-windows.zip).FullName
      - name: Fresh native installation without preinstalled Python
        shell: powershell
        run: ./scripts/smoke_windows_native.ps1 -Archive (Get-Item dist/release/*-windows.zip).FullName
  runtime:
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    runs-on: windows-2025
    # Healthy preflight + full-suite runs approached 35 minutes on Windows.
    # Individual native/async tests retain their 120-second watchdogs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-release.lock
          python -m pip install --no-deps -e .
        continue-on-error: false
      - name: Native ripgrep
        shell: powershell
        run: |
          $url = 'https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest -UseBasicParsing $url -OutFile "$env:RUNNER_TEMP\rg.zip"
          Invoke-WebRequest -UseBasicParsing "$url.sha256" -OutFile "$env:RUNNER_TEMP\rg.sha256"
          $hashes = [Regex]::Matches([IO.File]::ReadAllText("$env:RUNNER_TEMP\rg.sha256"), '(?i)(?<![0-9a-f])[0-9a-f]{64}(?![0-9a-f])')
          if ($hashes.Count -ne 1) { throw 'Invalid checksum file' }
          $hash = $hashes[0].Value.ToLowerInvariant()
          if ((Get-FileHash "$env:RUNNER_TEMP\rg.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'ripgrep checksum failed' }
          Expand-Archive "$env:RUNNER_TEMP\rg.zip" "$env:RUNNER_TEMP\rg"
          "$env:RUNNER_TEMP\rg\ripgrep-15.2.0-x86_64-pc-windows-msvc" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Native verification regressions
        run: >-
          python -c "import sys,unittest; sys.path.insert(0,'tests');
          from scripts.run_native_tests import NativeTestResult,install_async_diagnostics;
          install_async_diagnostics();
          suite=unittest.defaultTestLoader.loadTestsFromNames(['test_windows_verification_compatibility','test_output_provenance','test_verification_artifact_evidence','test_long_scenario_commands','test_long_goal_driver','test_long_task_continuation','test_tui_readability','test_gui_async_scans','test_execution_display','test_ui_conversation']);
          result=unittest.TextTestRunner(verbosity=2,resultclass=NativeTestResult).run(suite);
          sys.exit(not result.wasSuccessful())"
      - name: Native runtime tests
        run: python -u scripts/run_native_tests.py
