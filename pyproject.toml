[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ignovate-harness"
version = "1.0.1"
description = "Local terminal coding agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/aycxd0528/ignovate_harness"
Documentation = "https://github.com/aycxd0528/ignovate_harness/blob/main/docs/PROJECT.md"

[project.scripts]
ignovate = "nailong.cli:main"
nailong = "nailong.cli:main"

[tool.setuptools]
py-modules = ["main", "agent", "agent_service", "config", "local_tools", "tools", "headless", "tui"]

[tool.setuptools.packages.find]
include = ["nailong*", "ui*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
